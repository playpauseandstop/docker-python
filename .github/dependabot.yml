version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/**/*"
    schedule:
      interval: "monthly"
      time: "05:00"
    open-pull-requests-limit: 10
    assignees:
      - "playpauseandstop"
    labels:
      - "build"
      - "ci"
      - "dependencies"
    groups:
      ci-dependencies:
        patterns: ["*"]
